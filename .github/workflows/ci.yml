name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Check preparation guards
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Prepare pinned upstream source
        run: python3 scripts/prepare.py
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.1
          components: rustfmt
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: .build/herdr -> target
      - name: Run affected Rust suites
        run: scripts/test.sh
      - name: Build an isolated debug executable
        working-directory: .build/herdr
        run: cargo build --locked --bin herdr
      - name: Exercise the TUI in disposable sessions
        run: |
          python3 tests/sliding_smoke.py .build/herdr/target/debug/herdr
          python3 tests/readable_smoke.py .build/herdr/target/debug/herdr
